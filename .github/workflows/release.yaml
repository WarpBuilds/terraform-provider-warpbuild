name: Release

# Builds, signs and publishes provider binaries when a version tag is pushed.
# The Terraform Registry consumes the GitHub release artifacts (zips,
# SHA256SUMS, signature, manifest).
#
# Signing secrets (GPG_PRIVATE_KEY / GPG_PASSPHRASE) live ONLY in Infisical
# (prod, /terraform-provider) and are fetched at run time via an OIDC machine
# identity. The identity's OIDC claims are bound to this repo's version-tag
# refs, so no other repo, branch, or workflow can read them; there are no
# GitHub-side copies. Identity ID comes from the INFISICAL_RELEASE_IDENTITY_ID
# repo variable.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: WarpBuilds/checkout@v7
        with:
          # goreleaser needs the full history to resolve the previous tag
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch signing key from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_RELEASE_IDENTITY_ID }}
          project-slug: warp-build-n8bs
          env-slug: prod
          secret-path: /terraform-provider

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
